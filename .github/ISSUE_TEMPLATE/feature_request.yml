name: Feature Request
description: Suggest a new feature or improvement for UIGrade AI
title: "[Feature]: "
labels: ["enhancement"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement!
        Before submitting, please check if a similar request already exists.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: |
        What problem does this feature solve?
        Describe the current limitation or pain point.
      placeholder: "As a [student/lecturer/admin], I struggle with... because..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the feature you would like to see.
      placeholder: "I would like..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: |
        Have you considered any alternative solutions or workarounds?
        Why is your proposed solution preferred?
    validations:
      required: false

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      multiple: true
      options:
        - Web — Authentication
        - Web — Student workflow
        - Web — Lecturer workflow
        - Web — Admin workflow
        - Web — Grading / AI
        - Web — UI / Design
        - Web — API
        - Android App
        - CI / Build
        - Documentation
        - Other
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority (from your perspective)
      options:
        - Low — nice to have
        - Medium — would significantly improve UX
        - High — blocking current use case
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any mockups, references, or related issues.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues and this is not a duplicate
          required: true
        - label: This feature is within the scope of UIGrade AI (educational grading platform)
          required: false
